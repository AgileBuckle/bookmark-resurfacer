{% extends "base.html" %}
{% block title %}Settings — Bookmark Resurfacer{% endblock %}
{% block content %}

<div class="card">
    <h2>Email Settings</h2>
    <form method="post" action="/settings/save">

        <fieldset>
            <legend>SMTP Server</legend>
            <div class="form-row">
                <div>
                    <label for="smtp_host">SMTP Host</label>
                    <input type="text" id="smtp_host" name="smtp_host" value="{{ settings.smtp_host }}" placeholder="smtp.gmail.com">
                </div>
                <div>
                    <label for="smtp_port">SMTP Port</label>
                    <input type="number" id="smtp_port" name="smtp_port" value="{{ settings.smtp_port }}">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="smtp_username">Username</label>
                    <input type="text" id="smtp_username" name="smtp_username" value="{{ settings.smtp_username }}">
                </div>
                <div>
                    <label for="smtp_password">Password</label>
                    <input type="password" id="smtp_password" name="smtp_password" value="{{ settings.smtp_password }}" placeholder="App password for Gmail">
                </div>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="smtp_use_tls" name="smtp_use_tls" value="true" {% if settings.smtp_use_tls == "true" %}checked{% endif %}>
                <label for="smtp_use_tls">Use TLS (STARTTLS)</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Recipients</legend>
            <div class="form-row">
                <div>
                    <label for="email_from">From Address</label>
                    <input type="email" id="email_from" name="email_from" value="{{ settings.email_from }}" placeholder="you@gmail.com">
                </div>
                <div>
                    <label for="email_to">To Address</label>
                    <input type="email" id="email_to" name="email_to" value="{{ settings.email_to }}" placeholder="you@gmail.com">
                </div>
            </div>
            <div>
                <label for="email_subject">Email Subject</label>
                <input type="text" id="email_subject" name="email_subject" value="{{ settings.email_subject }}">
            </div>
        </fieldset>

        <fieldset>
            <legend>Schedule</legend>
            <div class="form-row">
                <div>
                    <label for="links_per_email">Links Per Email</label>
                    <input type="number" id="links_per_email" name="links_per_email" value="{{ settings.links_per_email }}" min="1" max="50">
                </div>
                <div>
                    <label for="schedule_interval_hours">Interval (hours)</label>
                    <input type="number" id="schedule_interval_hours" name="schedule_interval_hours" value="{{ settings.schedule_interval_hours }}" min="1" step="0.5">
                </div>
            </div>
        </fieldset>

        <div class="btn-row">
            <button type="submit">Save Settings</button>
            <button type="button" onclick="sendTest()" class="btn-secondary">Send Test Email</button>
        </div>
    </form>
</div>

<script>
async function sendTest() {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
        const res = await fetch("/api/send-test", { method: "POST" });
        const data = await res.json();
        alert(data.sent ? "Test email sent!" : "Failed to send. Check settings and server logs.");
    } catch (e) {
        alert("Error: " + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Send Test Email";
    }
}
</script>

{% endblock %}
